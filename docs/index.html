<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plate">
<meta name="theme-color" content="#0F1110">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Plate</title>
<style>
  :root {
    --bg: #0F1110; --card: #181B1A; --card2: #202422; --line: #2A2F2D; --text: #EEF1EF; --dim: #8D9692;
    --accent: #3DDC84; --protein: #5AA9FF; --carbs: #F2B544; --fat: #E9788E; --bad: #FF6B6B; --warn: #F2B544;
    --r: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));
    min-height: 100vh; overscroll-behavior-y: none;
  }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; }
  h1 { font-size: 22px; margin: 6px 0 14px; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  .card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px;
    padding: 13px 16px; background: var(--card2); font-weight: 600; min-height: 48px; text-decoration: none; color: var(--text); }
  .btn.primary { background: var(--accent); color: #06210F; }
  .btn.danger { background: transparent; color: var(--bad); }
  .btn.ghost { background: transparent; color: var(--dim); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }
  input[type=text], input[type=number], input[type=password], input[type=time], input[type=tel], textarea, select {
    width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 76px; }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }

  /* top date bar */
  .datebar { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .datebar button { background: var(--card); border: 0; width: 44px; height: 44px; border-radius: 12px; font-size: 20px; }
  .datebar .title { text-align: center; }
  .datebar .title b { display: block; font-size: 18px; }

  /* calorie ring */
  .hero { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .mid b { font-size: 28px; letter-spacing: -.02em; }
  .ring .mid span { font-size: 12px; color: var(--dim); }
  .macros { flex: 1; min-width: 0; }
  .macro { margin-bottom: 10px; }
  .macro .spread { font-size: 14px; }
  .macro .spread b { font-weight: 600; }
  .bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .macro.big .spread { font-size: 16px; }
  .macro.big .bar { height: 12px; }

  /* entries */
  .entry { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .entry:first-child { border-top: 0; }
  .thumb { width: 56px; height: 56px; border-radius: 12px; background: var(--card2) center/cover no-repeat; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .entry .info { flex: 1; min-width: 0; }
  .entry .info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .entry .nums { text-align: right; font-size: 14px; }
  .entry .nums b { display: block; font-size: 16px; }

  /* steps */
  .steps b { font-size: 24px; }

  /* add screen */
  .favs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fav { background: var(--card2); border: 0; border-radius: 12px; padding: 12px; text-align: left; min-height: 64px; }
  .fav b { display: block; font-size: 14px; font-weight: 600; }
  .fav span { font-size: 12px; color: var(--dim); }
  .photo-pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 100%;
    min-height: 120px; border: 2px dashed var(--line); border-radius: var(--r); background: var(--card); font-weight: 600; }
  .photo-pick .big { font-size: 34px; }
  .preview { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--r); display: block; }

  /* review */
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .info b { font-weight: 600; }
  .item .x { background: var(--card2); border: 0; border-radius: 10px; width: 36px; height: 36px; color: var(--dim); font-size: 18px; flex: none; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 8px 12px; min-width: 48px; }
  .seg button.on { background: var(--accent); color: #06210F; border-color: var(--accent); font-weight: 700; }
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .totals label span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .totals input { padding: 10px 8px; text-align: center; }
  .pill { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--card2); color: var(--dim); }
  .pill.high { color: var(--accent); } .pill.low { color: var(--warn); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--card2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--bad); }
  .check { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); }

  /* history */
  .hrow { display: grid; grid-template-columns: 74px 1fr 64px 62px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; text-decoration: none; color: var(--text); }
  .hrow:first-of-type { border-top: 0; }
  .hrow .bar { margin: 0; }
  .avg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .avg b { display: block; font-size: 20px; }
  .avg span { font-size: 12px; color: var(--dim); }
  .ok { color: var(--accent); } .meh { color: var(--warn); } .no { color: var(--bad); }

  /* settings */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  code, .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--card2);
    padding: 2px 5px; border-radius: 6px; word-break: break-all; }
  ol.steps-how { padding-left: 20px; margin: 8px 0; }
  ol.steps-how li { margin-bottom: 8px; }

  /* tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15,17,16,.94); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    align-items: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--dim); text-decoration: none;
    font-size: 11px; padding: 6px 0; }
  .tabbar a.on { color: var(--text); }
  .tabbar a svg { width: 24px; height: 24px; }
  .tabbar a.plus { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #06210F;
    justify-content: center; margin: -22px 8px 0; box-shadow: 0 6px 20px rgba(61,220,132,.3); }
  .tabbar a.plus svg { width: 30px; height: 30px; }

  /* progress profile */
  .profile { display: flex; gap: 18px; align-items: center; margin-bottom: 12px; }
  .avatar { width: 86px; height: 86px; border-radius: 50%; background: var(--card2) center/cover no-repeat; flex: none;
    border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .pstats { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .pstats b { display: block; font-size: 19px; }
  .pstats span { font-size: 12px; color: var(--dim); }
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 0 -16px; }
  .pgrid a { position: relative; aspect-ratio: 3 / 4; background: var(--card2) center/cover no-repeat; display: block; }
  .pgrid .w { position: absolute; left: 6px; bottom: 6px; font-size: 12px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 6px; }
  .pgrid .d { position: absolute; right: 6px; bottom: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 6px; }
  .pgrid .multi { position: absolute; right: 6px; top: 6px; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000; }
  .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel img { flex: none; width: 100%; scroll-snap-align: center; object-fit: contain; max-height: 72vh; background: #000; }
  .dots { text-align: center; color: var(--dim); font-size: 12px; margin: 6px 0 10px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 -10px; }
  .compare img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: #000; display: block; }
  .compare .cap { text-align: center; font-size: 13px; margin-top: 6px; }
  .picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .picks div, .picks .add { aspect-ratio: 3 / 4; background: var(--card2) center/cover no-repeat; border-radius: 10px; position: relative; }
  input[type=date] { width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 48px; }
  .picks .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; font-size: 15px; background: rgba(0,0,0,.6); color: #fff; }
  .picks .add { display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--dim); border: 2px dashed var(--line); background: none; }
  .nudge { border: 1px solid var(--accent); }
  .heat { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 3px; }
  .heat i, i.key { display: block; aspect-ratio: 1; border-radius: 4px; background: var(--card2); }
  .heat i.l1, i.key.l1 { background: rgba(61,220,132,.38); }
  .heat i.l2, i.key.l2 { background: var(--accent); }
  .heat i.f { background: transparent; }
  i.key { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; }
  .heatmarks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; text-align: center; font-size: 10px; color: var(--accent); min-height: 14px; margin-top: 3px; }
  .delta.down { color: var(--accent); } .delta.up { color: var(--warn); }

  /* lift */
  .ex .last { font-size: 13px; color: var(--dim); margin: 4px 0 8px; }
  .setrow { display: grid; grid-template-columns: 24px 1fr 18px 1fr 56px; gap: 8px; align-items: center; padding: 5px 0; }
  .setrow .n, .setrow .times { color: var(--dim); font-size: 13px; text-align: center; }
  .setrow input { text-align: center; font-size: 18px; padding: 10px 4px; min-height: 48px; appearance: textfield; -moz-appearance: textfield; }
  .setrow input::-webkit-inner-spin-button, .setrow input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .tick { width: 56px; height: 48px; border: 0; border-radius: 12px; background: var(--card2); color: var(--dim); font-size: 22px; font-weight: 700; }
  .setrow.done .tick { background: var(--accent); color: #06210F; }
  .setrow.done input { border-color: var(--accent); color: var(--accent); }
  .wrow { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; text-decoration: none; color: var(--text); }
  .wrow.two { grid-template-columns: 1fr auto; }
  .wrow:first-child { border-top: 0; }
  .chart { width: 100%; height: auto; display: block; }
  .tpl .tex { border-top: 1px solid var(--line); padding: 10px 0; }
  .trow { display: grid; grid-template-columns: 1fr 44px 44px 44px; gap: 6px; }
  .trow .x, .tpl .row .x { background: var(--card2); border: 0; border-radius: 10px; min-height: 44px; color: var(--dim); font-size: 18px; flex: none; width: 44px; }
  .trow .x:disabled { opacity: .3; }
  .tnums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
  .tnums label span { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .tnums input { padding: 10px 4px; text-align: center; }
  .heat i.lift, i.key.lift { box-shadow: inset 0 0 0 2px var(--protein); }
  #rest { position: fixed; left: 12px; right: 12px; bottom: calc(82px + env(safe-area-inset-bottom)); background: #2B302E; border-radius: 14px;
    padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 10px; z-index: 6; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #rest[hidden] { display: none; }
  #rest b { font-size: 26px; font-variant-numeric: tabular-nums; flex: 1; letter-spacing: -.01em; }
  body.resting #toast { bottom: calc(160px + env(safe-area-inset-bottom)); }
  body.resting { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }   /* so the bar never hides the buttons at the end of the page */

  /* talk */
  main.talk { display: flex; flex-direction: column; padding-bottom: 0;
    min-height: calc(100vh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    min-height: calc(100dvh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .chat { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.u { align-self: flex-end; background: rgba(61,220,132,.2); border-bottom-right-radius: 6px; }
  .msg.a { align-self: flex-start; background: var(--card); border-bottom-left-radius: 6px; }
  .note { text-align: center; margin: 10px 0; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; vertical-align: middle; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .composer { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom)); background: var(--bg); padding: 8px 0 10px; margin-top: 8px; }
  .composer textarea { min-height: 48px; max-height: 140px; }
  .composer .btn { flex: none; }
  .notes { white-space: pre-wrap; margin: 0; font-family: inherit; font-size: 13px; line-height: 1.5; max-height: 45vh; overflow: auto; }

  /* moments: calm blue, big targets, nothing that shouts */
  .wavebtn { background: rgba(90,169,255,.14); border: 1px solid rgba(90,169,255,.35); color: var(--text); margin-bottom: 12px; font-size: 17px; }
  .wavecard { border: 1px solid rgba(90,169,255,.45); }
  .x { background: var(--card2); border: 0; border-radius: 10px; width: 36px; height: 36px; color: var(--dim); font-size: 18px; flex: none; }   /* the base look; the list-specific rules above still win */
  .calm { text-align: center; padding: 18px 0 6px; }
  .calm h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; }
  .calm p { margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--card2); color: var(--text); border-radius: 99px;
    padding: 9px 14px; min-height: 40px; font-size: 15px; }
  .chip.on { background: rgba(90,169,255,.22); border-color: var(--protein); font-weight: 600; }
  .chip button { background: none; border: 0; color: var(--dim); padding: 0 0 0 8px; font-size: 17px; line-height: 1; }
  input[type=range].big { width: 100%; height: 44px; margin: 6px 0; accent-color: var(--protein); }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .scale button { min-height: 60px; border: 0; border-radius: 12px; background: var(--card2); font-size: 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; }
  .scale button span { font-size: 12px; color: var(--dim); }
  .scale button.on { background: rgba(90,169,255,.22); box-shadow: inset 0 0 0 2px var(--protein); font-weight: 700; }
  .scale.ten button { min-height: 52px; font-size: 20px; }   /* 1-10 as two rows of five: iOS sliders don't jump to a tap, buttons do */
  .ends { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ends button { min-height: 56px; border: 1px solid var(--line); border-radius: 12px; background: var(--card2); font-weight: 600; }
  .ends button.on { background: rgba(90,169,255,.22); border-color: var(--protein); }
  .pstep { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .pstep:first-child { border-top: 0; padding-top: 0; }
  .pstep .tick { width: 48px; flex: none; }
  .pstep.done .tick { background: var(--protein); color: #06210F; }
  .btn.recording { background: var(--bad); color: #fff; }

  #toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: #2B302E; color: var(--text); padding: 12px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center;
    opacity: 0; pointer-events: none; transition: .2s; z-index: 9; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  #toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabbar" id="tabs">
  <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>Today</a>
  <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>History</a>
  <a href="#/add" class="plus" data-tab="add" aria-label="Log food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
  <a href="#/me" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Progress</a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
</nav>
<div id="toast"><span id="toastText"></span><button id="toastBtn" hidden></button></div>
<div id="rest" hidden><span class="dim small">Rest</span><b id="restLeft">0:00</b><button class="btn" data-act="restAdd">+30 s</button><button class="btn ghost" data-act="restSkip">Skip</button></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="progIn" accept="image/*" multiple hidden>

<script type="module">
// ---------- constants ----------
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm";
const MODEL = "claude-opus-5-5";
// Claude Opus 5.5, dollars per token: input, output, cache write, cache read
const PRICE_IN = 4 / 1e6, PRICE_OUT = 20 / 1e6, PRICE_CACHE_W = 5 / 1e6, PRICE_CACHE_R = 0.2 / 1e6;
const DEFAULT_REPO = "PerryIndustries/plate-data";
const DEFAULTS = { cal: 2050, protein: 160, carbs: 215, fat: 60, stepsGoal: 9000, dayStart: 4, goalsU: 0,

async function ghGetText(path) {
  const r = await gh(path);
  if (r.status === 404) return [null, undefined];
  if (!r.ok) throw new Error("GitHub said " + r.status);
  const b = await r.json();
  return [b64decode(b.content || ""), b.sha];
}
// the new sha when saved; null when the file changed first (read again and retry)
async function ghPutText(path, text, sha, message) {
  const body = { message: message || "sync", content: b64encode(text) };
  if (sha) body.sha = sha;
  const r = await gh(path, { method: "PUT", body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return null;
  if (!r.ok) throw new Error("GitHub said " + r.status + " when saving");
  const b = await r.json().catch(() => ({}));
  return (b.content && b.content.sha) || "";
}
async function ghList(path) {
  const r = await gh(path);
  if (r.status === 404) return [];
  if (!r.ok) throw new Error("GitHub said " + r.status);
  const list = await r.json();
  return Array.isArray(list) ? list : [];
}
// null when the file isn't there; anything else that isn't an answer throws, so a delete is retried rather than silently skipped
async function ghSha(path) {
  const r = await gh(path);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub said " + r.status);
  return ((await r.json()) || {}).sha || null;
}
// a file that is already gone counts as deleted
async function ghDelete(path, sha, message) {
  const r = await gh(path, { method: "DELETE", body: JSON.stringify({ message: message || "remove", sha }) });
  if (r.status === 404) return;
  if (!r.ok) throw new Error("GitHub said " + r.status + " when deleting");
}
async function ghPhoto(id) {
  const r = await gh("photos/" + id + ".jpg");
  if (!r.ok) return null;
  const b = await r.json();
  return b.content ? "data:image/jpeg;base64," + b.content.replace(/\s/g, "") : null;
}
// Of two copies of one record, the one saved last; the repo's copy wins a tie.
function newer(a, b) {
  if (!a || typeof a !== "object") return b && typeof b === "object" ? b : null;
  if (!b || typeof b !== "object") return a;
  return (b.u || 0) > (a.u || 0) ? b : a;
}
function mergeById(remote, local) {
  const map = new Map();
  for (const x of remote || []) map.set(x.id, x);
  for (const x of local || []) map.set(x.id, newer(map.get(x.id), x));
  return [...map.values()].sort((a, b) => (a.id < b.id ? -1 : 1));
}
// undo of a soft delete, by id: a sync in between may have re-sorted the array, so an index would point at the wrong record
const undelete = (arr, id) => arr.map((x) => (x.id === id ? Object.assign({}, x, { del: false, u: Date.now() }) : x));
const mergeDay = (r, l) => ({ date: (r || l || {}).date, entries: mergeById((r || {}).entries, (l || {}).entries), steps: newer((r || {}).steps, (l || {}).steps) });
const mergeFavs = (r, l) => ({ favs: mergeById((r || {}).favs, (l || {}).favs) });
const mergeGoals = (r, l) => newer(r, l);
const mergeProgress = (r, l) => ({ profile: newer((r || {}).profile, (l || {}).profile), posts: mergeById((r || {}).posts, (l || {}).posts) });
const mergeLift = (r, l) => ({ templates: mergeById((r || {}).templates, (l || {}).templates), workouts: mergeById((r || {}).workouts, (l || {}).workouts) });
// After "Delete all" (momentsWipedAt), anything in the repo from before the wipe is something he deleted: it comes back as a tombstone, never as content.
// Only when this phone's copy is on the table (l given), so syncFile sees the tombstones as new from here and writes them up for other phones too.
function mergeMoments(r, l) {
  const wiped = l ? S.meta.momentsWipedAt || 0 : 0;
  const keep = (xs) => (xs || []).map((x) => (x && !x.del && (x.u || 0) < wiped ? { id: x.id, u: wiped, del: true } : x));
  const R = r || {}, rl = R.lists && (R.lists.u || 0) < wiped ? null : R.lists;
  return { waves: mergeById(keep(R.waves), (l || {}).waves), checkins: mergeById(keep(R.checkins), (l || {}).checkins),
    habits: mergeById(keep(R.habits), (l || {}).habits), wins: mergeById(keep(R.wins), (l || {}).wins), lists: newer(rl, (l || {}).lists) };
}
// Merge one file with our copy and write it back when we add anything.
async function syncFile(path, local, merge) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const [remote, sha] = await ghGet(path);
    const merged = merge(remote, local);
    if (JSON.stringify(merged) === JSON.stringify(merge(remote, null))) return merged;   // nothing new from this phone
    if (await ghPut(path, b64encode(JSON.stringify(merged)), sha)) return merged;
  }
  throw new Error("the backup kept changing; will try again shortly");
}

let syncTimer = 0, syncing = false, syncAgain = null;   // syncAgain: a sync was asked for while one was running; it runs once this one is done
S.syncStatus = "";
function scheduleSync(ms) {
  if (!syncOn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), ms);
}
async function syncNow({ full = false } = {}) {
  if (!syncOn()) return;
  if (syncing) { syncAgain = { full: full || !!(syncAgain && syncAgain.full) }; return; }
  syncing = true;
  setSyncStatus("Backing up…");
  try {
    // goals
    const goals = Object.fromEntries(GOAL_KEYS.map((k) => [k, S.settings[k]]));
    goals.u = S.settings.goalsU || 0;
    const g = await syncFile("settings.json", goals, mergeGoals);
    if (g && (g.u || 0) > (S.settings.goalsU || 0)) {
      for (const k of GOAL_KEYS) if (g[k] != null) S.settings[k] = g[k];
      S.settings.goalsU = g.u;
      await saveSettings();
    }
    // Each file's merged copy is merged once more with what's here now, so anything saved while that upload ran isn't lost (newer u wins).
    // saved meals
    const f = await syncFile("favorites.json", { favs: S.favs }, mergeFavs);
    S.favs = mergeById(f.favs, S.favs);
    await put("favs", S.favs);
    // progress profile and posts (the photos themselves go up through photoQueue)
    const pr = await syncFile("progress.json", { profile: S.profile, posts: S.posts }, mergeProgress);
    if (pr) {
      S.posts = mergeById(pr.posts, S.posts);
      S.profile = Object.assign({}, PROFILE_DEFAULT, newer(pr.profile, S.profile) || {});
      await put("posts", S.posts);
      await put("profile", S.profile);
    }
    // workout sessions and the log
    const wk = await syncFile("workouts.json", { templates: S.templates, workouts: S.workouts }, mergeLift);
    if (wk) {
      S.templates = mergeById(wk.templates, S.templates);
      S.workouts = mergeById(wk.workouts, S.workouts);
      await put("templates", S.templates);
      await put("workouts", S.workouts);
    }
    // repo files he asked to have gone (Remove from backup, a deleted voice note, Delete all): retried until each one is, backup switch or not
    if ((S.meta.remoteDeletes || []).length) await runRemoteDeletes();
    // moments: only with his explicit say-so. Reflections never go up; voice notes only with the second switch.
    if (S.settings.momentsBackup) {
      const mo = await syncFile("moments.json", momentsForSync(), mergeMoments);
      if (mo) {
        // merged once more through mergeMoments (not mergeById) so a "Delete all" that ran while the file was in flight still wins
        const M = S.moments, m2 = mergeMoments(mo, momentsForSync());
        M.waves = m2.waves; M.checkins = m2.checkins; M.habits = m2.habits; M.wins = m2.wins;
        M.lists = m2.lists || M.lists;
        if (!Array.isArray(M.lists.steps)) M.lists.steps = defaultSteps();
        await put("moments", M);
        S.meta.momentsSynced = 1;
      }
      if (S.settings.momentsAudioBackup) for (const id of [...S.meta.audioQueue]) {
        const blob = await get("audio:" + id);
        if (blob) await ghPut("audio/" + id + "." + audioExt(blob), b64bytes(new Uint8Array(await blob.arrayBuffer())), undefined, "voice note");   // false = already there
        S.meta.audioQueue = S.meta.audioQueue.filter((x) => x !== id);
      }
    }
    // days: everything changed here, plus the last two days in case another device logged something
    const dates = new Set([...S.meta.dirty, today(), shiftDay(today(), -1)]);
    if (full || !S.meta.restored) {
      for (const it of await ghList("days")) { const m = /^(\d{4}-\d{2}-\d{2})\.json$/.exec(it.name); if (m) dates.add(m[1]); }
    }
    for (const date of dates) {
      const before = S.days[date] || null;
      let merged = await syncFile("days/" + date + ".json", before, mergeDay);
      const touched = (S.days[date] || null) !== before;   // food logged here while this file was going up: keep it, and keep the day dirty
      if (touched) merged = Object.assign(mergeDay(merged, S.days[date]), { date });
      if (merged && (merged.entries.length || merged.steps)) { S.days[date] = merged; await put("day:" + date, merged); }
      if (!touched) S.meta.dirty = S.meta.dirty.filter((d) => d !== date);
    }
    S.meta.restored = 1;
    // photos that haven't gone up yet
    for (const id of [...S.meta.photoQueue]) {
      const d = await get("photo:" + id);
      if (d) await ghPut("photos/" + id + ".jpg", d.split(",")[1], undefined, "photo");   // false = already there, which is fine
      S.meta.photoQueue = S.meta.photoQueue.filter((x) => x !== id);
    }
    await saveMeta();
    await pullSteps();
    S.meta.lastSync = Date.now();
    await saveMeta();
    setSyncStatus("Backed up " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }));
    // not the live logger or the session editor, and never while he's typing: a re-render would drop the keyboard
    const a = document.activeElement, typing = !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && view.contains(a);
    if (["today", "history", "me", "lift", "moments", "patterns"].includes(route().name) && !["go", "templates"].includes(route().args[0]) && !typing) render();
  } catch (e) {
    setSyncStatus("Backup failed: " + e.message, true);
  } finally {
    syncing = false;
    const again = syncAgain;
    syncAgain = null;
    if (again) setTimeout(() => syncNow(again), 1000);
  }
}
// The iPhone Shortcut writes steps/<date>_<steps>_<time>.json, so the file names alone carry the numbers.
async function pullSteps() {
  const list = await ghList("steps");
  const next = {};
  for (const it of list) {
    const m = /^(\d{4}-\d{2}-\d{2})_([\d.,]+)(?:_(\d{4,6}))?/.exec(decodeURIComponent(it.name));
    if (!m) continue;
    const n = Math.round(parseFloat(m[2].replace(/,/g, "")));
    if (!isFinite(n)) continue;
    const cur = next[m[1]];
    if (!cur || n > cur.n) next[m[1]] = { n, at: m[3] || "" };
  }
  S.steps = next;
  await put("steps", S.steps);
}
function setSyncStatus(text, bad) {
  S.syncStatus = text;
  S.syncBad = !!bad;
  const el = $("syncStatus");
  if (el) { el.textContent = text; el.className = "small " + (bad ? "error" : "dim"); }
}

// ---------- routing ----------
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const name = parts[0] || "today";
  return { name, args: parts.slice(1) };
}
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

let lastRoute = null;
function render() {
  const r = route();
  const tab = { today: "today", day: "today", history: "history", add: "add", review: "add", edit: "today", favorites: "add", settings: "settings",
    me: "me", post: "me", newpost: "me", compare: "me", lift: "today", talk: "me", wave: "today", moments: "me", patterns: "me" }[r.name] || "today";
  document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  const fn = { today: viewDay, day: viewDay, add: viewAdd, review: viewReview, edit: viewReview, history: viewHistory, favorites: viewFavs, settings: viewSettings,
    me: viewMe, post: viewPost, newpost: viewNewPost, compare: viewCompare, lift: viewLift, talk: viewTalk, wave: viewWave, moments: viewMoments, patterns: viewPatterns }[r.name] || viewDay;
  const chat = r.name === "talk" && !!r.args[0];
  view.classList.toggle("talk", chat);
  // leaving the wave being recorded stops the recorder (and the mic); the note is kept
  if (rec && !(r.name === "wave" && (r.args[0] || (liveWave() || {}).id) === rec.waveId)) stopRec();
  view.innerHTML = fn(r);
  hydratePhotos();
  hydrateAudio();
  if (!(r.name === "wave" && !r.args[0])) pend = null;   // an untouched #/wave leaves nothing behind
  if (!(r.name === "wave" && r.args[1] === "follow") && fdraft) { fdraft = null; saveFdraft(true); }
  if (r.name !== "patterns") refl = null;
  if (chat) window.scrollTo(0, document.body.scrollHeight);
  // leaving a chat with unsaved replies: offer the notes once, without blocking
  const prev = lastRoute;
  lastRoute = r;
  if (prev && prev.name === "talk" && prev.args[0] && !(chat && r.args[0] === prev.args[0])) offerWrap(prev.args[0]);
}

// ---------- views ----------
function ring(value, goal) {
  const R = 56, C = 2 * Math.PI * R, frac = Math.min(1, goal ? value / goal : 0);
  const over = value > goal * 1.05;
  return `<svg width="132" height="132" viewBox="0 0 132 132">
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--card2)" stroke-width="12"/>
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="${over ? "var(--bad)" : "var(--accent)"}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>`;
}
function macroBar(label, val, goal, color, big) {
  const pct = goal ? Math.min(100, (val / goal) * 100) : 0;
  return `<div class="macro${big ? " big" : ""}"><div class="spread"><span>${label}</span><span><b>${fmt(val)}</b><span class="dim"> / ${fmt(goal)} g</span></span></div>
    <div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}

function draftTotals(d) {
  const m = +d.servings || 1;
  const sum = (k) => d.items.reduce((a, it) => a + (+it[k] || 0), 0) * m;
  // no item list (saved meals, typed numbers): scale the per-serving numbers instead
  const b = d.base || {};
  const t = d.items.length ? { cal: sum("calories"), p: sum("protein"), c: sum("carbs"), f: sum("fat"), fiber: sum("fiber") }
    : { cal: (+b.cal || 0) * m, p: (+b.p || 0) * m, c: (+b.c || 0) * m, f: (+b.f || 0) * m, fiber: (+b.fiber || 0) * m };
  for (const k of ["cal", "p", "c", "f"]) if (d.override && d.override[k] != null && d.override[k] !== "") t[k] = +d.override[k];
  return t;
}

function viewHistory() {
  const s = S.settings, t0 = today();
  const days = Array.from({ length: 28 }, (_, i) => shiftDay(t0, -i));
  const week = (start) => {
    const ds = Array.from({ length: 7 }, (_, i) => shiftDay(start, -i)).filter((d) => totals(d).n > 0);
    const stepsDs = Array.from({ length: 7 }, (_, i) => shiftDay(start, -i)).map(stepsFor).filter(Boolean);
    const avg = (f) => (ds.length ? ds.reduce((a, d) => a + f(totals(d)), 0) / ds.length : null);
    return { cal: avg((x) => x.cal), p: avg((x) => x.p), steps: stepsDs.length ? stepsDs.reduce((a, x) => a + x.n, 0) / stepsDs.length : null,
      hitP: ds.filter((d) => totals(d).p >= s.protein * 0.95).length, logged: ds.length };
  };
  // weeks end yesterday, so a half-eaten today doesn't drag the average down
  const w1 = week(shiftDay(t0, -1)), w2 = week(shiftDay(t0, -8));
  const arrow = (a, b, goodUp) => (a == null || b == null || Math.abs(a - b) < 1 ? "" : (a > b) === goodUp ? ` <span class="ok">▲</span>` : ` <span class="no">▼</span>`);
  const calClass = (cal) => (Math.abs(cal - s.cal) <= s.cal * 0.1 ? "ok" : cal < s.cal ? "meh" : "no");
  return `
  <h1>History</h1>
  <div class="card">
    <div class="small dim" style="margin-bottom:10px">Last 7 days (not counting today) · ${w1.logged} days logged</div>
    <div class="avg">
      <div><b>${w1.cal == null ? "—" : fmt(w1.cal)}</b><span>avg cal${arrow(w1.cal, w2.cal, false)}</span></div>
      <div><b style="color:var(--protein)">${w1.p == null ? "—" : fmt(w1.p) + "g"}</b><span>avg protein${arrow(w1.p, w2.p, true)}</span></div>
      <div><b>${w1.steps == null ? "—" : fmt(w1.steps)}</b><span>avg steps${arrow(w1.steps, w2.steps, true)}</span></div>
    </div>
    <p class="small dim" style="margin:12px 0 0">Hit protein on ${w1.hitP} of ${w1.logged || 0} logged days. Targets: ${fmt(s.cal)} cal, ${fmt(s.protein)}g protein, ${fmt(s.stepsGoal)} steps.</p>
  </div>
  <div class="card">
    <div class="hrow small dim" style="border:0;padding-top:0"><span>Day</span><span>Calories</span><span>Protein</span><span>Steps</span></div>
    ${days.map((d) => {
      const t = totals(d), st = stepsFor(d);
      return `<a class="hrow" href="#/day/${d}">
        <span>${h(d === t0 ? "Today" : shortDate(d))}</span>
        <span>${t.n ? `<span class="${calClass(t.cal)}">${fmt(t.cal)}</span><div class="bar"><i style="width:${Math.min(100, (t.cal / s.cal) * 100)}%;background:var(--accent)"></i></div>` : `<span class="dim">—</span>`}</span>
        <span class="${t.n ? (t.p >= s.protein * 0.95 ? "ok" : "meh") : "dim"}">${t.n ? fmt(t.p) + "g" : "—"}</span>
        <span class="${st ? (st.n >= s.stepsGoal ? "ok" : "") : "dim"}">${st ? (st.n / 1000).toFixed(1) + "k" : "—"}</span>
      </a>`;
    }).join("")}
  </div>`;
}

// ---------- progress profile (private: photos stay on the phone and the private backup, never sent to Claude) ----------
const livePosts = () => S.posts.filter((p) => !p.del).sort((a, b) => (a.date === b.date ? (a.at || 0) - (b.at || 0) : a.date < b.date ? -1 : 1));
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const shortMD = (date) => new Date(date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const longDate = (date) => new Date(date + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const lb = (n) => (+n).toFixed(1).replace(/\.0$/, "");
function progressStats() {
  const ps = livePosts(), w = ps.filter((p) => p.weight > 0);
  const first = w[0] || null, last = w[w.length - 1] || null;
  return { ps, first, last, lost: first && last ? first.weight - last.weight : null,
    weeks: ps.length ? Math.floor(daysBetween(ps[0].date, today()) / 7) : 0 };
}
const loggedDay = (date) => totals(date).n > 0;
const proteinDay = (date) => { const t = totals(date); return t.n > 0 && t.p >= S.settings.protein * 0.95; };
// days in a row with food logged; an empty today doesn't break it until the day is over
function logStreak() {
  let d = today(), n = 0;
  if (!loggedDay(d)) d = shiftDay(d, -1);
  while (loggedDay(d)) { n++; d = shiftDay(d, -1); }
  return n;
}
// back-to-back 7-day windows (ending today) that each have a check-in
function checkinStreak() {
  const dates = livePosts().map((p) => p.date);
  let end = today(), n = 0;
  while (dates.some((d) => { const k = daysBetween(d, end); return k >= 0 && k < 7; })) { n++; end = shiftDay(end, -7); }
  return n;
}
function heatmap() {
  const t = today(), dow = (new Date(t + "T12:00:00").getDay() + 6) % 7;   // 0 = Monday
  const start = shiftDay(t, -dow - 7 * 11);
  const posted = new Set(livePosts().map((p) => p.date));
  const lifted = new Set(liveWorkouts().map((w) => w.date));
  let cells = "", marks = "";
  for (let w = 0; w < 12; w++) {
    let week = false;
    for (let r = 0; r < 7; r++) {
      const d = shiftDay(start, w * 7 + r);
      if (posted.has(d)) week = true;
      const cls = d > t ? "f" : proteinDay(d) ? "l2" : loggedDay(d) ? "l1" : "";
      cells += `<i class="${cls}${lifted.has(d) ? " lift" : ""}" title="${d}"></i>`;
    }
    marks += `<span>${week ? "●" : ""}</span>`;
  }
  return `<div class="heat">${cells}</div><div class="heatmarks">${marks}</div>`;
}
function progressNudge() {
  const ps = livePosts();
  const card = (title, sub) => `<a class="card nudge" href="#/newpost" data-act="newPost" style="display:block;text-decoration:none;color:var(--text)"><b>${title}</b><div class="small dim">${sub}</div></a>`;
  if (!ps.length) return card("Start your progress profile", "Take your day-one photos. Only you see them.");
  const since = daysBetween(ps[ps.length - 1].date, today());
  return since >= 7 ? card("Weekly check-in", since + " days since your last progress photo. Same mirror, same light.") : "";
}
function deltaHtml(cur, prev, label) {
  if (!(cur > 0) || !(prev > 0)) return "";
  const d = Math.round((cur - prev) * 10) / 10;
  const txt = d === 0 ? "no change" : (d < 0 ? "−" : "+") + lb(Math.abs(d)) + " lb";
  return `<span class="delta ${d < 0 ? "down" : d > 0 ? "up" : ""}">${txt}</span> <span class="dim">${label}</span>`;
}

function viewMe() {
  const st = progressStats(), p = S.profile, ps = st.ps.slice().reverse();

  const start = st.first ? st.first.weight : null, cur = st.last ? st.last.weight : null;

  return `
  <div class="profile">

  </div>

  <a class="btn block" href="#/talk" style="margin-bottom:8px;justify-content:space-between"><span>💬 Talk</span><span class="dim small" style="font-weight:400">a private chat with Claude ›</span></a>
  <a class="btn block" href="#/moments" style="margin-bottom:12px;justify-content:space-between"><span>🌊 Moments</span><span class="dim small" style="font-weight:400">waves, check-ins, patterns ›</span></a>
  <div class="card">

    <p class="small" style="margin:10px 0 0">Logged food <b>${logged30}</b> of the last 30 days · hit protein on <b>${protein30}</b>.</p>
    <p class="small" style="margin:4px 0 0">${ws.length ? `Lifted <b>${lifted7}</b> time${lifted7 === 1 ? "" : "s"} this week · <b>${lifted30}</b> in the last 30 days.` : `No workouts yet. <a href="#/lift">Start one</a>.`}</p>
    <div class="row small dim" style="margin-top:6px;gap:12px;flex-wrap:wrap"><span><i class="key l1"></i> logged</span><span><i class="key l2"></i> hit protein</span><span><i class="key lift"></i> lifted</span><span><span style="color:var(--accent)">●</span> check-in week</span></div>
  </div>
  ${p.showWeight && start ? `<div class="card">
    <div class="spread small"><span class="dim">Start ${lb(start)}</span><span><b>${lb(cur)} lb</b> now</span><span class="dim">Goal ${lb(p.goal)}</span></div>
    <div class="bar"><i style="width:${pct}%;background:var(--accent)"></i></div>
  </div>` : ""}
  <button class="btn primary block" data-act="newPost" style="margin-bottom:14px">+ New progress post</button>
  ${ps.length ? `<div class="pgrid">${ps.map((x) => `<a href="#/post/${x.id}" data-photo="${x.photos[0] || ""}" aria-label="Post from ${h(shortMD(x.date))}">
      ${x.photos.length > 1 ? `<span class="multi">❐</span>` : ""}${p.showWeight && x.weight ? `<span class="w">${lb(x.weight)}</span>` : ""}<span class="d">${h(shortMD(x.date))}</span></a>`).join("")}</div>`
    : `<p class="dim small" style="text-align:center">No posts yet. Your first one is day one.</p>`}
  <p class="small dim" style="text-align:center;margin-top:16px">Private. These photos live on this phone${syncOn() && S.settings.backupProgress !== false ? " and in your private backup" : ""} and are never sent to Claude.</p>`;
}

function viewPost(r) {

  return `
  <div class="spread" style="margin:4px 0 10px"><a href="#/me" class="small">‹ Profile</a><span class="dim small">${h(longDate(p.date))}</span></div>

    <div class="spread"><b style="font-size:18px">${i === 0 ? "Day one" : "Check-in #" + (i + 1)}</b><span class="small dim">${i === 0 ? "" : "week " + (Math.floor(daysBetween(ps[0].date, p.date) / 7) + 1)}</span></div>
    ${S.profile.showWeight && p.weight ? `<div class="small" style="margin-top:4px">${lb(p.weight)} lb ${firstW && firstW !== p ? " · " + deltaHtml(p.weight, firstW.weight, "since start") : ""}${prevW ? " · " + deltaHtml(p.weight, prevW.weight, "since " + h(shortMD(prevW.date))) : ""}</div>` : ""}

}

function viewCompare(r) {
  const ps = livePosts(), a = ps.find((x) => x.id === r.args[0]);
  if (!a) return `<p class="dim">That post is gone. <a href="#/me">Back to your profile</a></p>`;
  const others = ps.filter((x) => x !== a);
  if (!others.length) return `<h1>Before / after</h1><p class="dim">This is your only post so far. Next week's check-in will be the first one to compare against.</p><a class="btn block" href="#/post/${a.id}">Back</a>`;
  // default partner: day one, or the latest post when this is day one
  const b = ps.find((x) => x.id === r.args[1] && x !== a) || (ps[0] !== a ? ps[0] : ps[ps.length - 1]);
  const [before, after] = ps.indexOf(a) < ps.indexOf(b) ? [a, b] : [b, a];
  const poses = Math.min(before.photos.length, after.photos.length);
  const k = Math.min(+r.args[2] || 0, poses - 1);
  const showW = S.profile.showWeight;
  const side = (x, label) => `<div><img data-img="${x.photos[k] || x.photos[0]}" alt="${label}"><div class="cap"><b>${label}</b> · ${h(shortMD(x.date))}${showW && x.weight ? `<div class="dim">${lb(x.weight)} lb</div>` : ""}</div></div>`;
  return `
  <div class="spread" style="margin:4px 0 10px"><a href="#/post/${a.id}" class="small">‹ Post</a><b>Before / after</b><span></span></div>
  <div class="compare">${side(before, "Before")}${side(after, "After")}</div>
  ${poses > 1 ? `<div class="seg" style="margin-top:12px;justify-content:center">${Array.from({ length: poses }, (_, i) => `<button class="${i === k ? "on" : ""}" data-act="cmpPose" data-a="${a.id}" data-b="${b.id}" data-k="${i}">Photo ${i + 1}</button>`).join("")}</div>` : ""}
  <div class="card" style="margin-top:12px;text-align:center">
    <b>${daysBetween(before.date, after.date)} days apart</b>
    ${showW && before.weight && after.weight ? `<div style="margin-top:4px">${deltaHtml(after.weight, before.weight, "")}</div>` : ""}
  </div>
  <label class="field"><span>Compare with</span><select data-cmp="${a.id}">${others.slice().reverse().map((x) => `<option value="${x.id}" ${x === b ? "selected" : ""}>${h(shortMD(x.date))}${x === ps[0] ? " (day one)" : ""}${showW && x.weight ? " · " + lb(x.weight) + " lb" : ""}</option>`).join("")}</select></label>`;
}

}
// the most recent finished workout where this exercise got done, skipping the one being edited
function lastFor(key, skipId) {

    if (ws[i].id === skipId) continue;
    const ex = ws[i].exercises.find((x) => x.key === key && doneSets(x).length);
    if (ex) return { date: ws[i].date, sets: doneSets(ex) };

}
// double progression: every set reached the top of the range last time, so add the exercise's increment
function suggest(ex, last) {
  if (!(ex.inc > 0) || !(ex.hi > 0) || !last) return 0;

  return top > 0 && last.sets.every((s) => +s.r >= +ex.hi) ? top + +ex.inc : 0;
}

    out.push(`- Waves: ${ws.length} (${by("passed")} passed, ${by("easing")} easing, ${by("still")} still there at follow-up, ${by("old")} went the usual way, ${ws.length - f.length} without a follow-up)${med ? `; the ones that eased took about ${med} min` : ""}.`);

    out.push("- Playbook steps tried: " + (tallyStr(ws.flatMap((w) => w.steps.map(stepLabel))) || "none ticked") + ".");
    const keys = stepKeys(ws.flatMap((w) => w.steps)), helped = tallyStr(f.flatMap((w) => (w.follow.helped || []).filter((k) => keys.includes(k)).map(stepLabel)));   // typed "other" text stays out
    if (helped) out.push("- Said it helped: " + helped + ".");
  }
  const cf = tallyStr(cs.flatMap((c) => c.feelings));
  out.push(cs.length ? `- Mood check-ins: ${cs.length}, average ${(cs.reduce((a, c) => a + c.overall, 0) / cs.length).toFixed(1)} of 5${cf ? "; feelings: " + cf : ""}.` : "- Mood check-ins: none.");

}

      if (!wv.steps.includes("voice")) wv.steps.push("voice");   // recording one is the step

async function audioURL(id) {
  if (audioURLs.has(id)) return audioURLs.get(id);
  let b = await get("audio:" + id);
  // a new phone with both switches on can pull a note back from the repo: raw bytes, since the JSON answer leaves `content` empty past 1 MB.
  // Nothing is cached unless real bytes came back, so a failed pull is simply tried again next time.
  if (!b && syncOn() && S.settings.momentsBackup && S.settings.momentsAudioBackup) {
    for (const ext of ["m4a", "webm"]) {
      try {
        const r = await gh("audio/" + id + "." + ext, { headers: { Accept: "application/vnd.github.raw" } });
        if (r.status === 404) continue;
        if (!r.ok) break;
        const buf = await r.arrayBuffer();
        if (!buf.byteLength) break;
        b = new Blob([buf], { type: ext === "m4a" ? "audio/mp4" : "audio/webm" });
        await put("audio:" + id, b);

}

    saveTemplates(t);
    render();
  },
  async dropTpl(b) {
    const i = S.templates.findIndex((x) => x.id === b.dataset.id);
    if (i < 0) return;
    const old = S.templates[i];
    S.templates[i] = Object.assign({}, old, { del: true, u: Date.now() });
    await put("templates", S.templates);
    scheduleSync(2000);
    render();
    toast("Removed " + old.name, "Undo", async () => { S.templates = undelete(S.templates, old.id); await put("templates", S.templates); scheduleSync(2000); render(); });
  },
  async export() {
    const photos = {};
    for (const k of await allKeys()) if (String(k).startsWith("photo:")) photos[k.slice(6)] = await get(k);
    const data = { app: "plate", exported: new Date().toISOString(), settings: Object.fromEntries(GOAL_KEYS.map((k) => [k, S.settings[k]])),
      favs: S.favs, days: S.days, steps: S.steps, profile: S.profile, posts: S.posts, templates: S.templates, workouts: S.workouts, photos };
    if (S.settings.momentsBackup) data.moments = momentsForSync();   // same rule as the repo: only when he opted in; never audio, never reflections
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const file = new File([blob], "plate-" + today() + ".json", { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch { /* fall through to download */ } }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
};

function ensureInputDraft(date) {
  if (!S.draft || S.draft.stage !== "input" || S.draft.date !== date) S.draft = { stage: "input", date, photo: null, big: null, text: "" };
  return S.draft;
}
function toReview(d, est) {
  S.draft = Object.assign(d, { stage: "review", time: d.date === today() ? nowHM() : "12:00", title: est.title, items: est.items,
    confidence: est.confidence, note: est.note, servings: 1, override: {}, src: d.photo ? "photo" : "text", saveFav: false });
  saveDraft();
  go("#/review");
}
function statusMsg(text, bad) {
  const el = $("estStatus");
  if (!el) return;
  el.innerHTML = text === "busy" ? `<div class="row"><div class="spinner"></div><span class="dim">Claude is reading your food…</span></div>`
    : `<p class="small ${bad ? "error" : "dim"}" style="margin:0">${h(text)}</p>`;
}

view.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b, e);
});
view.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "talkIn") { tdraft[route().args[0]] = t.value; t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; return; }
  if (t.id === "talkAbout") { S.talkAbout = t.value; return saveAbout(); }
  if (t.dataset.wave) {   // riding a wave: the one-liner autosaves, no re-render under his thumb
    const w = findWave(t.dataset.id);
    if (!w) return;
    w.text = t.value;
    touch(w);
    return saveMomentsSoon();
  }
  if (t.dataset.fbind && fdraft) { fdraft[t.dataset.fbind] = t.value; return saveFdraft(); }
  if (t.id === "winIn") return setWin(t.value);
  if (t.dataset.pbind && S.pdraft) { S.pdraft[t.dataset.pbind] = t.value; return savePdraft(); }
  if (t.dataset.wb && S.wdraft) {
    const d = S.wdraft, k = t.dataset.wb;
    if (k === "note") d.note = t.value; else d.exercises[+t.dataset.i].sets[+t.dataset.j][k] = t.value;
    return saveWdraft();
  }
  if (t.dataset.tb) {
    const tpl = S.templates.find((x) => x.id === t.dataset.t), k = t.dataset.tb;
    if (!tpl) return;
    if (k === "tname") tpl.name = t.value;
    else {
      const ex = tpl.exercises[+t.dataset.i];
      if (!ex) return;
      if (k === "name") { ex.name = t.value; if (freshEx.has(ex)) ex.key = slug(t.value); }
      else if (k === "note") ex.note = t.value;
      else ex[k] = t.value === "" ? 0 : +t.value;
    }
    return saveTemplates(tpl);
  }
  if (t.dataset.bind === "text") {
    const a = route().args[0];
    ensureInputDraft(/^\d{4}-\d{2}-\d{2}$/.test(a || "") ? a : today()).text = t.value;
    return saveDraft();
  }
  const d = S.draft;
  if (!t.dataset.bind || !d) return;
  const k = t.dataset.bind;
  if (k === "tot") {
    d.override = d.override || {};
    d.override[t.dataset.k] = t.value;
    const save = view.querySelector('[data-act="saveEntry"]');
    const tt = draftTotals(d);
    if (save) save.textContent = "Save · " + fmt(tt.cal) + " cal, " + fmt(tt.p) + "g protein";
  } else if (k === "saveFav") d.saveFav = t.checked;
  else d[k] = t.value;
  saveDraft();
});
view.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.bind === "saveFav" && S.draft) { S.draft.saveFav = t.checked; saveDraft(); return; }
  if (t.id === "talkAbout") { clearTimeout(aboutTimer); aboutTimer = 0; S.talkAbout = t.value; return put("talkAbout", S.talkAbout); }   // blur: write it now
  if (t.dataset.cmp) return go("#/compare/" + t.dataset.cmp + "/" + t.value);
  const k = t.dataset.set;
  if (!k) return;
  let v = t.type === "checkbox" ? t.checked : t.value.trim();
  if (GOAL_KEYS.includes(k)) { v = +v; if (!(v >= 0)) return; S.settings.goalsU = Date.now(); }
  S.settings[k] = v;
  await saveSettings();
  if (k === "token" || k === "repo") { S.meta.restored = 0; await saveMeta(); if (syncOn()) syncNow(); else setSyncStatus("Not backed up: everything lives on this phone only."); }
  else if (GOAL_KEYS.includes(k)) scheduleSync(2000);
  else if (k === "restTimer") restBar();
  else if (k === "momentsBackup") {   // off takes the audio switch with it; on starts the first upload
    if (!v) { S.settings.momentsAudioBackup = false; await saveSettings(); } else scheduleSync(500);
    render();
  } else if (k === "momentsAudioBackup" && v) {   // every note already on the phone goes up too
    S.meta.audioQueue = [...new Set(S.meta.audioQueue.concat(allAudioIds()))];
    await saveMeta();
    scheduleSync(500);
  }
  toast("Saved");
});
view.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.ladd) { e.preventDefault(); addToList(e.target.dataset.ladd, e.target); }
});
$("rest").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
});
$("photoIn").addEventListener("change", async () => {
  const file = $("photoIn").files[0];
  if (!file) return;
  const r = route();
  const date = r.name === "add" && /^\d{4}-\d{2}-\d{2}$/.test(r.args[0] || "") ? r.args[0] : today();
  const d = ensureInputDraft(date);
  const typed = $("foodText")?.value;
  if (typed != null) d.text = typed;
  try {
    Object.assign(d, await readPhoto(file));
    saveDraft();
    render();
  } catch {
    toast("Couldn't open that photo. Try another one.");
  }
});
$("progIn").addEventListener("change", async () => {
  const files = [...$("progIn").files];
  if (!files.length) return;
  if (!S.pdraft || S.pdraft.editing) S.pdraft = { date: today(), photos: [], weight: "", caption: "" };
  for (const f of files.slice(0, 6 - S.pdraft.photos.length)) {
    // 1080px keeps progress photos sharp enough to compare, and small enough to back up
    try { S.pdraft.photos.push(scaled(await loadImage(f), 1080, 0.82)); } catch { toast("Couldn't open one of those photos."); }
  }
  await savePdraft();
  render();
});
// going to the background (or being closed): iOS may never bring this page back, so save what the debounces are holding
window.addEventListener("pagehide", flushDrafts);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return flushDrafts();
  // after a long time away, pull new steps and show the right day
  if (Date.now() - (S.meta.lastSync || 0) > 10 * 60e3) syncNow();
  if (["today"].includes(route().name)) render();
  restBar();   // the phone was locked: show what's actually left of the rest, not where the counter stopped
  checkFollow();
});

// ---------- boot ----------
await load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// The review screen survives the app being closed mid-log; anything else starts on Today.
if (["review", "edit"].includes(route().name) && !(S.draft && S.draft.stage === "review")) location.hash = "#/";
render();
restBar();
checkFollow();   // a wave from a while ago with no follow-up yet: ask once
if (syncOn()) syncNow();
</script>
</body>
</html>
